name: Build and Push Multi-Arch Docker Image

description: |
  Builds and pushes a multi-architecture Docker image (amd64 and arm64) to Docker Hub.
  Supports both version tags and additional tags like 'prod' or 'staging'.

inputs:
  DOCKERHUB_USERNAME:
    description: "Docker Hub username"
    required: true
  DOCKERHUB_PASSWORD:
    description: "Docker Hub password or access token"
    required: true
  IMAGE_NAME:
    description: "Docker Hub image name without tag (e.g., username/repo)"
    required: true
  IMAGE_TAG:
    description: "Primary image tag (e.g., version number, git sha)"
    required: true
  ADDITIONAL_TAGS:
    description: "Comma-separated additional tags (e.g., 'latest,prod')"
    required: false
    default: ""
  DOCKERFILE_PATH:
    description: "Path to Dockerfile"
    required: false
    default: "./Dockerfile"
  BUILD_CONTEXT:
    description: "Build context path"
    required: false
    default: "."

outputs:
  IMAGE_WITH_TAG:
    description: "Full Docker Hub image name with primary tag"
    value: ${{ steps.meta.outputs.tags }}
  IMAGE_DIGEST:
    description: "Image digest"
    value: ${{ steps.build.outputs.digest }}
  DOCKERHUB_IMAGE:
    description: "Full Docker Hub image name with new tag"
    value: ${{ steps.push.outputs.DOCKERHUB_IMAGE }}

runs:
  using: "composite"
  steps:
    - name: Print Build Information
      run: |
        echo "======================================"
        echo "IMAGE_NAME: ${{ inputs.IMAGE_NAME }}"
        echo "IMAGE_TAG: ${{ inputs.IMAGE_TAG }}"
        echo "ADDITIONAL_TAGS: ${{ inputs.ADDITIONAL_TAGS }}"
        echo "DOCKERFILE: ${{ inputs.DOCKERFILE_PATH }}"
        echo "CONTEXT: ${{ inputs.BUILD_CONTEXT }}"
        echo "======================================"
      shell: bash

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.DOCKERHUB_USERNAME }}
        password: ${{ inputs.DOCKERHUB_PASSWORD }}

    - name: Prepare tags
      id: meta
      run: |
        TAGS="${{ inputs.IMAGE_NAME }}:${{ inputs.IMAGE_TAG }}"
        
        # Add additional tags if provided
        if [ -n "${{ inputs.ADDITIONAL_TAGS }}" ]; then
          IFS=',' read -ra EXTRA_TAGS <<< "${{ inputs.ADDITIONAL_TAGS }}"
          for tag in "${EXTRA_TAGS[@]}"; do
            TAGS="$TAGS,${{ inputs.IMAGE_NAME }}:${tag}"
          done
        fi
        
        echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
        echo "Building with tags: $TAGS"
      shell: bash

    - name: Build and push multi-arch image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.BUILD_CONTEXT }}
        file: ${{ inputs.DOCKERFILE_PATH }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image digest
      run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
      shell: bash

    - name: Logout from Docker Hub
      if: always()
      run: docker logout
      shell: bash